services:
    postgres:
        image: postgres:18.1
        container_name: postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
        secrets:
            - postgres_password
        volumes:
            - postgres_data:/var/lib/postgresql
        networks:
            - vps
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    # Read-only, allow-listed view of the Docker API for Traefik. Traefik never
    # touches the real socket, so a compromised proxy cannot start containers,
    # exec into them, or read the host filesystem.
    docker-socket-proxy:
        image: tecnativa/docker-socket-proxy:v0.5.0
        container_name: docker-socket-proxy
        restart: unless-stopped
        environment:
            CONTAINERS: 1
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
        networks:
            - socket
        security_opt:
            - no-new-privileges:true

    traefik:
        image: traefik:v3.7
        container_name: traefik
        restart: unless-stopped
        depends_on:
            - docker-socket-proxy
        command:
            - "--global.checknewversion=false"
            - "--global.sendanonymoususage=false"
            - "--providers.docker=true"
            - "--providers.docker.endpoint=tcp://docker-socket-proxy:2375"
            - "--providers.docker.exposedbydefault=false"
            - "--providers.docker.network=vps"
            - "--providers.file.filename=/etc/traefik/dynamic.yml"
            - "--entrypoints.web.address=:80"
            - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
            - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
            - "--entrypoints.websecure.address=:443"
            - "--entrypoints.websecure.http.middlewares=secure-headers@file"
            - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
            - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
            - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
        ports:
            - "0.0.0.0:80:80"
            - "0.0.0.0:443:443"
            - "[::]:80:80"
            - "[::]:443:443"
        volumes:
            - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
            - letsencrypt:/letsencrypt
        networks:
            - vps
            - socket
        read_only: true
        cap_drop:
            - ALL
        cap_add:
            - NET_BIND_SERVICE
        security_opt:
            - no-new-privileges:true

secrets:
    postgres_password:
        file: ./secrets/postgres_password

volumes:
    postgres_data:
    letsencrypt:

networks:
    vps:
        name: vps
    socket:
        internal: true
